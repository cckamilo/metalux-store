<header class="fixed top-0 z-30 w-full border-b border-gray-200 bg-white text-gray-900">
  <div class="flex items-center justify-center bg-[#111] px-4 py-[7px] text-center text-[12px] leading-4 text-white">
    <p>Envío gratis desde $200.000 · Pago contra entrega.</p>
  </div>
  <div class="relative mx-auto flex w-full max-w-[1800px] flex-wrap items-center gap-x-4 px-4 sm:px-6 xl:h-16 xl:flex-nowrap xl:px-0">
    <button #menuToggle type="button" (click)="$event.stopPropagation(); isMenuOpen = !isMenuOpen"
      [attr.aria-expanded]="isMenuOpen" aria-controls="catalog-navigation"
      [attr.aria-label]="isMenuOpen ? 'Cerrar menú' : 'Abrir menú'"
      class="flex h-11 w-11 shrink-0 items-center justify-center hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-black xl:hidden">
      <ng-icon [name]="isMenuOpen ? closeIcon : menuIcon" size="1.25rem" class="h-5 w-5"></ng-icon>
    </button>

    <a routerLink="/" (click)="goHome()" class="flex h-16 shrink-0 items-center gap-2 border-b-2" aria-label="Metaluxe, inicio"
      [attr.aria-current]="activeNavigation.has('Inicio') ? 'page' : null"
      [class.border-black]="activeNavigation.has('Inicio')" [class.border-transparent]="!activeNavigation.has('Inicio')">
      <img src="assets/images/img-1.png" alt="Metaluxe" class="h-[26px] w-[26px] object-contain" />
      <span class="text-[19px] font-extrabold tracking-tight" style="font-family: 'Fredoka', sans-serif;">Metaluxe</span>
    </a>

    <nav id="catalog-navigation" aria-label="Navegación del catálogo" (click)="$event.stopPropagation()"
      (keydown.escape)="closeMenu(); menuToggle.focus()"
      [ngClass]="isMenuOpen ? 'flex' : 'hidden'"
      style="font-family: Inter, 'Segoe UI', system-ui, sans-serif"
      class="absolute left-0 top-full max-h-[calc(100dvh-146px)] w-full flex-col overflow-y-auto border-b border-gray-200 bg-white p-4 shadow-lg xl:static xl:ml-auto xl:flex xl:w-auto xl:flex-row xl:items-center xl:gap-6 xl:overflow-visible xl:border-0 xl:p-0 xl:shadow-none">
      @for (item of quickNavigation; track item) {
        <button type="button" (click)="selectQuickFilter(item.filter)"
          [attr.aria-current]="activeNavigation.has(item.filter) ? 'true' : null"
          [class.border-black]="activeNavigation.has(item.filter)" [class.border-transparent]="!activeNavigation.has(item.filter)"
          class="flex min-h-11 items-center border-b-2 text-[12px] font-semibold uppercase tracking-[0.12em] text-[#111] transition-colors hover:border-black focus-visible:border-black">
          {{ item.label }}
        </button>
      }
    </nav>

    <form role="search" (ngSubmit)="submitSearch()" class="order-last flex h-[52px] w-full items-start xl:order-none xl:ml-auto xl:h-16 xl:w-[240px] xl:shrink-0 xl:items-center">
      <div class="flex h-10 w-full items-center gap-2 rounded-full border border-gray-300 bg-gray-50 px-3 focus-within:border-black">
        <ng-icon [name]="searchIcon" size="1rem" class="h-4 w-4 shrink-0 text-gray-500"></ng-icon>
        <input type="search" name="catalogSearch" autocomplete="off" placeholder="Buscar banda o álbum"
          aria-label="Buscar productos por banda o álbum" [ngModel]="searchQuery" (ngModelChange)="search($event)"
          class="min-w-0 flex-1 bg-transparent text-sm outline-none" />
          @if (searchQuery) {
            <button type="button" (click)="search('')" aria-label="Limpiar búsqueda"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded hover:bg-gray-200">
              <ng-icon [name]="closeIcon" size="1rem" class="h-4 w-4"></ng-icon>
            </button>
          }
        </div>
      </form>

      <div class="ml-auto flex h-16 shrink-0 items-center gap-1 xl:ml-0">
        <button (click)="toggleCartSidebar()" type="button" aria-label="Abrir carrito"
          class="relative flex h-11 w-11 items-center justify-center hover:bg-gray-100">
          <ng-icon [name]="cartIcon" size="1.25rem" class="h-5 w-5"></ng-icon>
          @if (totalCount() > 0) {
            <span class="absolute right-0 top-0 flex h-[18px] w-[18px] items-center justify-center rounded-full bg-black text-[11px] font-bold leading-none text-white">{{ totalCount() }}</span>
          }
        </button>
        <button type="button" aria-label="Cuenta de usuario" class="hidden h-11 w-11 items-center justify-center hover:bg-gray-100 sm:flex">
          <ng-icon [name]="userIcon" size="1.25rem" class="h-5 w-5"></ng-icon>
        </button>
      </div>
    </div>
  </header>

  <app-cart-list [isOpen]="isCartSidebarOpen" (close)="closeCartSidebar()"></app-cart-list>
