<footer class="mt-20 w-full bg-black text-white">
  <div class="mx-auto w-full max-w-[1200px] px-4 pt-14 pb-8" style="padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));">
    <div class="grid grid-cols-2 gap-x-6 gap-y-8 min-[641px]:grid-cols-[2fr_1fr_1fr] min-[641px]:gap-x-10">
      <div class="col-span-2 min-w-0 min-[641px]:col-span-1">
        <a routerLink="/" (click)="showHome()" aria-label="Metaluxe, inicio"
          class="inline-flex min-h-11 items-center gap-2 rounded focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
          <img src="assets/images/img-1.png" alt="" class="h-7 w-7 object-contain" />
          <span class="text-xl font-bold tracking-tight" style="font-family: 'Fredoka', sans-serif;">Metaluxe</span>
        </a>
        <p class="mt-3 max-w-sm text-[13px] leading-5 text-[#B0B0B0]">Vinilos y CDs de metal. Envío gratis desde $200.000 en Colombia.</p>
      </div>

      <nav aria-labelledby="footer-store-title" class="min-w-0">
        <h2 id="footer-store-title" class="text-xs font-semibold uppercase tracking-[0.12em] text-[#B0B0B0]">Tienda</h2>
        <ul class="mt-3 space-y-0.5">
          @for (item of storeLinks; track item) {
            <li>
              <button type="button" (click)="selectFilter(item.filter)"
                class="inline-flex min-h-7 max-w-full items-center rounded text-left text-sm text-white hover:underline hover:underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
                {{ item.label }}
              </button>
            </li>
          }
        </ul>
      </nav>

      <nav aria-labelledby="footer-help-title" class="min-w-0">
        <h2 id="footer-help-title" class="text-xs font-semibold uppercase tracking-[0.12em] text-[#B0B0B0]">Ayuda</h2>
        <ul class="mt-3 space-y-0.5">
          @for (item of helpLinks; track item) {
            <li>
              <button type="button" (click)="showHelp(item.label, item.message)"
                class="inline-flex min-h-7 max-w-full items-center rounded text-left text-sm text-white hover:underline hover:underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
                {{ item.label }}
              </button>
            </li>
          }
          <li>
            <a href="mailto:hola@metaluxe.example"
              class="inline-flex min-h-7 max-w-full items-center rounded text-sm text-white hover:underline hover:underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
              Contacto
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="mt-10 flex min-h-10 flex-wrap items-center justify-between gap-x-6 gap-y-2 border-t border-[#2A2A2A] pt-4 text-xs leading-5 text-[#B0B0B0]">
      <p>&copy; {{ year }} Metaluxe</p>
      <p>Pago contra entrega disponible</p>
    </div>
  </div>
</footer>
