<app-active-filters [filters]="activeFilters" (remove)="removeFilter.emit($event)" (clear)="clearFilters.emit()">
  <p id="catalog-results" role="status" aria-atomic="true" class="shrink-0 whitespace-nowrap text-sm text-gray-600">
    Mostrando <span class="font-semibold text-gray-900">{{ visibleCount }}</span> de
    <span class="font-semibold text-gray-900">{{ totalCount }}</span> {{ totalCount === 1 ? 'producto' : 'productos' }}
  </p>
</app-active-filters>
<div class="relative flex w-full max-w-[280px] shrink-0 flex-row items-center gap-3 sm:ml-auto">
  <label for="sort" class="shrink-0 text-[11px] font-medium uppercase tracking-[0.12em] text-gray-900">Ordenar por</label>
  <div class="relative min-w-0 flex-1">
    <button type="button" id="sort" (click)="$event.stopPropagation(); sortMenuOpen = !sortMenuOpen"
      [attr.aria-expanded]="sortMenuOpen" aria-haspopup="listbox"
      class="flex h-10 w-full min-w-0 items-center justify-between rounded border border-gray-300 bg-white px-3 text-left text-[13px] text-gray-700 outline-none focus:border-black">
      <span>{{ selectedSortLabel }}</span>
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="ml-3 h-4 w-4 shrink-0 transition-transform duration-200 motion-reduce:transition-none"
      [class.rotate-180]="sortMenuOpen"><path d="m6 9 6 6 6-6" /></svg>
    </button>
    @if (sortMenuOpen) {
      <div role="listbox" aria-label="Ordenar por"
        class="absolute left-0 top-full z-30 mt-1 w-full overflow-hidden rounded border border-gray-300 bg-white shadow-lg">
        @for (option of sortOptions; track option) {
          <button type="button" role="option"
            [attr.aria-selected]="selectedSort === option.value" (click)="selectSort(option.value)"
          class="block w-full px-3 py-2 text-left text-[13px] text-gray-700 transition hover:bg-gray-100">{{ option.label }}</button>
        }
      </div>
    }
  </div>
</div>
