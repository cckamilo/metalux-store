<div aria-label="Mensajes para el usuario" class="pointer-events-none fixed right-4 top-[calc(1rem+env(safe-area-inset-top))] z-[100] flex max-h-[calc(100dvh-2rem)] w-[min(24rem,calc(100vw-2rem))] flex-col gap-3 overflow-y-auto">
  @for (message of service.messages(); track message.id) {
    <section
      [attr.role]="message.type === 'error' || message.type === 'warning' ? 'alert' : 'status'"
      [attr.aria-live]="message.type === 'error' || message.type === 'warning' ? 'assertive' : 'polite'"
      aria-atomic="true"
      class="pointer-events-auto flex items-start gap-3 rounded-lg border border-gray-200 border-l-4 bg-white p-4 text-gray-900 shadow-lg"
      [class.border-l-emerald-600]="message.type === 'success'"
      [class.border-l-red-600]="message.type === 'error'"
      [class.border-l-amber-500]="message.type === 'warning'"
      [class.border-l-sky-600]="message.type === 'info'">
      <ng-icon [name]="iconFor(message.type)" size="1.25rem" aria-hidden="true"
        class="mt-0.5 h-5 w-5 shrink-0"
        [class.text-emerald-700]="message.type === 'success'"
        [class.text-red-700]="message.type === 'error'"
        [class.text-amber-700]="message.type === 'warning'"
        [class.text-sky-700]="message.type === 'info'"></ng-icon>
      <div class="min-w-0 flex-1">
        <h2 class="text-sm font-bold">{{ message.title }}</h2>
        <p class="mt-1 break-words text-sm leading-5 text-gray-700">{{ message.text }}</p>
      </div>
      @if (message.dismissible) {
        <button type="button" (click)="service.dismiss(message.id)"
          [attr.aria-label]="'Cerrar mensaje: ' + message.title"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black">
          <ng-icon name="lucideX" size="1rem" class="h-4 w-4"></ng-icon>
        </button>
      }
    </section>
  }
</div>
