<div *ngIf="isOpen" (click)="onClose()" class="fixed inset-0 z-40 bg-black/50 transition-opacity duration-300 ease-out">

  <div (click)="$event.stopPropagation()"
    class="fixed top-0 right-0 h-full w-96 z-40 bg-white shadow-lg transform transition-transform duration-300 overflow-y-auto"
    [ngClass]="{ 'translate-x-full': !isOpen, 'translate-x-0': isOpen }">

    <div class="flex items-center justify-between px-4 py-4 border-b border-gray-200">
      <span class="text-lg font-semibold text-gray-800">Tu carrito</span>

      <div class="flex items-center gap-4">
        <button (click)="onClearCart()" class="text-gray-500 hover:text-red-500">
          <lucide-icon [img]="trashIcon" class="w-5 h-5"></lucide-icon>
        </button>
        
        <button (click)="onClose()" class="text-xl">✕</button>
      </div>
    </div>

    <div class="p-4 space-y-4 text-sm text-gray-700">

      <div *ngFor="let item of cartItems()" class="flex items-center justify-between">
        <img *ngIf="item.image" [src]="item.image" [alt]="item.name" class="h-14 w-14 rounded object-cover" />

        <div class="flex-grow">
          <p class="font-semibold">{{ item.name }}</p>
          <p class="text-xs text-gray-500">Cantidad: {{ item.quantity }}</p>
          <p class="text-xs text-gray-500">{{ formatearPrecio(item.price) }}</p>
        </div>

        <div class="flex items-center gap-2">
            <button class="text-lg px-2" (click)="decreaseQuantity(item)">−</button>

            <span>{{ item.quantity }}</span>

            <button class="text-lg px-2" (click)="increaseQuantity(item)">+</button>

            <button (click)="removeProduct(item.id)" class="text-red-500 hover:text-red-700">
              <lucide-icon [img]="trashIcon" class="w-4 h-4"></lucide-icon>
            </button>
        </div>
      </div>

      <div class="border-t pt-4 font-bold">
        Total: {{ formatearPrecio(totalPrice()) }}
      </div>
    </div>
  </div>
</div>
