<section *ngIf="slides.length > 0" class="relative isolate mb-4 h-[132px] overflow-hidden bg-gradient-to-r from-[#450a0a] to-[#991b1b] text-white"
  [class.blue]="slides[activeIndex].theme === 'blue'"
  [style.background]="slides[activeIndex].theme === 'blue' ? 'linear-gradient(100deg, #0f172a, #1e3a8a 55%, #1d4ed8)' : null"
  aria-label="Campañas destacadas" aria-live="polite">
  <div aria-hidden="true"
    [style.background]="slides[activeIndex].theme === 'blue' ? 'radial-gradient(circle, #0b1220 0 14%, #3b82f6 15% 60%, #1e3a8a 61% 100%)' : null"
    class="pointer-events-none absolute -right-[130px] top-1/2 h-[300px] w-[300px] -translate-y-1/2 rounded-full bg-gradient-to-br from-red-500 to-red-950 opacity-[0.55]"></div>

  <div class="relative z-10 flex h-full items-center justify-between gap-3 sm:gap-6"
    [ngClass]="slides.length > 1 ? 'px-[68px]' : 'px-4 sm:px-6'">
    <div class="min-w-0 flex-1">
      <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-white/85">
        Campaña activa
      </p>
      <h2 class="mt-1 line-clamp-1 text-[26px] leading-[1.2] text-white" style="font-family: Georgia, serif">
        {{ slides[activeIndex].title }}
      </h2>
      <p *ngIf="slides[activeIndex].description"
        class="mt-1 line-clamp-1 text-sm leading-[1.2] text-white/[0.92]">
        {{ slides[activeIndex].description }}
      </p>
      <p *ngIf="getValidityLabel(slides[activeIndex]) as validityLabel"
        class="mt-1 text-xs leading-[1.2] text-white/85">
        {{ validityLabel }}
      </p>
    </div>

    <div class="flex shrink-0 flex-col items-end gap-1">
      <button *ngIf="slides[activeIndex].cta" type="button"
        (click)="handleCta(slides[activeIndex].cta)"
        class="rounded-[6px] bg-white px-5 py-[11px] text-xs font-bold uppercase tracking-[0.08em] text-[#111] transition hover:bg-gray-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
        Ver ofertas
      </button>
      <div *ngIf="slides.length > 1" class="flex items-center gap-0.5">
        <button *ngFor="let slide of slides; let i = index" type="button"
          (click)="select(i)" [attr.aria-label]="'Ver campaña ' + (i + 1)"
          [attr.aria-current]="i === activeIndex ? 'true' : null"
          class="flex h-7 w-6 items-center justify-center rounded-full focus-visible:outline-2 focus-visible:outline-white">
          <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-white/50 transition-all"
            [class.w-4]="i === activeIndex" [class.bg-white]="i === activeIndex"></span>
        </button>
      </div>
    </div>
  </div>
  <ng-container *ngIf="slides.length > 1">
    <button type="button" (click)="previous()" aria-label="Campaña anterior"
      class="absolute left-4 top-1/2 z-30 grid h-9 w-9 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-white text-[#111] shadow-[0_4px_12px_rgba(0,0,0,0.25)] hover:bg-[#f4f4f5] focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-white">
      <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <button type="button" (click)="next()" aria-label="Siguiente campaña"
      class="absolute right-4 top-1/2 z-30 grid h-9 w-9 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-white text-[#111] shadow-[0_4px_12px_rgba(0,0,0,0.25)] hover:bg-[#f4f4f5] focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-white">
      <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
  </ng-container>
</section>
