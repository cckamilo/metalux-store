<section *ngIf="slides.length > 0" class="relative mb-4 overflow-hidden bg-gray-950 text-white shadow-sm"
  aria-label="Campanas destacadas" aria-live="polite">
  <div class="relative min-h-[300px] sm:min-h-[330px]">
    <img [src]="slides[activeIndex].imageUrl"
      [alt]="slides[activeIndex].title"
      class="absolute inset-0 h-full w-full object-cover opacity-65 transition-opacity duration-700" />
    <div class="absolute inset-0 bg-gradient-to-r from-black/95 via-black/55 to-black/10"></div>

    <div class="relative z-10 flex min-h-[300px] max-w-2xl flex-col justify-center px-14 pt-8 pb-16 sm:min-h-[330px] sm:px-16 lg:px-20">
      <p *ngIf="slides[activeIndex].eyebrow" class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-gray-300">
        {{ slides[activeIndex].eyebrow }}
      </p>
      <h2 class="max-w-xl text-3xl font-bold leading-tight sm:text-4xl" style="font-family: Georgia, serif">
        {{ slides[activeIndex].title }}
      </h2>
      <p *ngIf="slides[activeIndex].description" class="mt-3 max-w-lg text-sm leading-relaxed text-gray-200">
        {{ slides[activeIndex].description }}
      </p>
      <button *ngIf="slides[activeIndex].cta" type="button"
        (click)="handleCta(slides[activeIndex].cta)"
        class="mt-5 w-fit rounded-sm bg-white px-5 py-3 text-xs font-bold uppercase tracking-wide text-gray-950 transition hover:bg-gray-200">
        {{ slides[activeIndex].cta?.label }}
      </button>
    </div>

    <div *ngIf="slides.length > 1" class="pointer-events-none absolute inset-0 z-10">
      <button type="button" (click)="previous()" aria-label="Campana anterior"
        class="pointer-events-auto absolute left-2 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white text-lg text-gray-900 shadow-sm transition hover:bg-gray-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white sm:left-4">
        <span aria-hidden="true">&#8592;</span>
      </button>
      <div class="pointer-events-auto absolute bottom-3 left-1/2 flex -translate-x-1/2 items-center">
        <button *ngFor="let slide of slides; let i = index" type="button"
          (click)="select(i)" [attr.aria-label]="'Ver campana ' + (i + 1)"
          [attr.aria-current]="i === activeIndex ? 'true' : null"
          class="flex h-11 w-11 items-center justify-center rounded-full focus-visible:outline-2 focus-visible:outline-white">
          <span aria-hidden="true" class="h-2.5 w-2.5 rounded-full bg-white/50 transition-all"
            [class.w-7]="i === activeIndex" [class.bg-white]="i === activeIndex"></span>
        </button>
      </div>
      <button type="button" (click)="next()" aria-label="Siguiente campana"
        class="pointer-events-auto absolute right-2 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white text-lg text-gray-900 shadow-sm transition hover:bg-gray-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white sm:right-4">
        <span aria-hidden="true">&#8594;</span>
      </button>
    </div>
  </div>
</section>
