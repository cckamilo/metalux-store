<!-- Contenedor principal del catálogo: controla scroll y cierre del popover cuando se hace click fuera -->
<section #scrollContainer (scroll)="onScroll()" (document:click)="closeGenreFilter()"
  class="mt-0 h-[calc(100vh-84px)] w-full overflow-y-auto bg-white px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-[1800px]">

    <!-- Carrusel principal de campañas promocionales de la home -->
    <app-campaign-carousel *ngIf="campaignSlides.length > 0" [slides]="campaignSlides"></app-campaign-carousel>

    <!-- Toolbar del catálogo: filtros por género y ordenamiento -->
    <section aria-label="Filtros y catálogo" class="mt-2">
      <div class="mb-4 flex border-b border-gray-200 pb-4">
        <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-end">
          <div class="relative flex flex-col gap-1" (click)="$event.stopPropagation()">
            <span class="text-[11px] text-gray-500">Filtrar por</span>
            <button type="button" (click)="showGenreFilter = !showGenreFilter"
              [attr.aria-expanded]="showGenreFilter" aria-controls="genre-filter-options"
              class="flex h-12 min-w-56 items-center justify-between border border-gray-400 bg-white px-4 text-left text-xs text-gray-900 transition hover:border-gray-700 focus:outline-none focus:ring-1 focus:ring-black">
              <span>{{ selectedGenreCount || 'Todos' }} seleccionados</span>
              <span aria-hidden="true" class="ml-4 text-base leading-none">⌄</span>
            </button>

            <div *ngIf="showGenreFilter" id="genre-filter-options"
              class="absolute left-0 top-full z-30 mt-1 w-72 border border-gray-300 bg-white p-3 shadow-lg">
              <div class="mb-2 flex items-center justify-between border-b border-gray-200 pb-2">
                <span class="text-xs font-medium text-gray-700">Géneros</span>
                <button *ngIf="hasSelectedGenres" type="button"
                  (click)="clearGenreFilters()" class="text-xs text-gray-500 underline hover:text-black">
                  Limpiar
                </button>
              </div>
              <label *ngFor="let genre of genreOptions" class="flex cursor-pointer items-center gap-2 py-2 text-xs text-gray-700">
                <input type="checkbox" [checked]="isGenreSelected(genre)"
                  (change)="toggleGenreFilter(genre, $any($event.target).checked)"
                  class="h-4 w-4 accent-black" />
                <span>{{ genre }}</span>
              </label>
            </div>
          </div>
          <div class="flex flex-col gap-1">
            <label for="sort" class="text-[11px] text-gray-500">Ordenar por</label>
            <select id="sort" [(ngModel)]="selectedSort" (change)="onSortChange()"
              class="h-12 min-w-60 border border-gray-400 bg-white px-4 text-xs text-gray-900 transition hover:border-gray-700 focus:outline-none focus:ring-1 focus:ring-black">
              <option *ngFor="let option of sortOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <ng-container *ngFor="let producto of visibleProducts">
          <app-product-card
            [product]="producto"
            [currentImage]="getCardState(producto).currentImage"
            [selectedQuantity]="getCardState(producto).selectedQuantity"
            [finalPrice]="getProductPrice(producto)"
            [hasDiscount]="hasDiscount(producto)"
            [discountLabel]="getDiscountLabel(producto)"
            [isProductNew]="isProductNew(producto)"
            [isActive]="producto.isActive"
            (previousImage)="previousImage(producto)"
            (nextImage)="nextImage(producto)"
            (selectImage)="selectImage(producto, $event)"
            (quantityChange)="setQuantity(producto, $event)"
            (addToCart)="addToCart(producto, $event)"
            (openDetails)="openModal(producto)">
          </app-product-card>
        </ng-container>
      </div>
    </section>

    <!-- Modal de detalle del producto para ver información completa antes de comprar -->
    <app-product-detail-modal [product]="selectedProduct" [show]="showModal"
      (close)="closeModal()"></app-product-detail-modal>

    <!-- Loader visual mientras se agregan más productos en la paginación incremental -->
    <div *ngIf="isLoadingMore" class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center">
      <div class="flex flex-col items-center">
        <div class="h-14 w-14 animate-spin rounded-full border-4 border-gray-200 border-t-black"></div>
        <span class="mt-4 text-sm font-medium text-black">Cargando más productos...</span>
      </div>
    </div>
  </div>

</section>
