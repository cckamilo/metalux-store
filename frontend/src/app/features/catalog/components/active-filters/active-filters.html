<div class="flex flex-row flex-wrap items-center gap-4 lg:flex-nowrap">
  <ng-content></ng-content>
  <div *ngIf="filters.length > 0" aria-label="Filtros activos" class="flex flex-row flex-wrap items-center gap-2 lg:flex-nowrap">
  <button *ngFor="let filter of filters; trackBy: trackFilter" type="button" (click)="remove.emit(filter)"
    [attr.aria-label]="'Quitar filtro: ' + filter.label"
    class="flex min-h-7 max-w-full shrink-0 items-center gap-1.5 rounded-full border border-gray-200 bg-gray-50 px-2 py-1 text-left text-[12px] leading-4 text-gray-700 transition hover:border-black focus-visible:outline-2 focus-visible:outline-black">
    <span class="min-w-0 break-words [overflow-wrap:anywhere] lg:whitespace-nowrap">{{ filter.label }}</span>
    <span aria-hidden="true" class="shrink-0 text-sm leading-none">&times;</span>
  </button>
  </div>
  <button *ngIf="filters.length > 0" type="button" (click)="clear.emit()"
    class="min-h-11 shrink-0 whitespace-nowrap text-[13px] font-medium text-gray-700 underline underline-offset-4 hover:text-black">Limpiar todo</button>
</div>
