<header class="fixed top-0 z-30 w-full border-b border-gray-200 bg-white text-gray-900">
  <div class="flex h-14 items-center justify-center bg-black px-4 text-center text-[11px] leading-4 text-white sm:h-9">
    <p><strong class="mr-2 uppercase tracking-wider">Demo</strong> Envío gratis desde $200.000 · Pago contra entrega. Condiciones ficticias.</p>
  </div>
  <div class="relative mx-auto flex w-full max-w-[1800px] flex-wrap items-center gap-x-4 px-4 sm:px-6 xl:flex-nowrap xl:px-8">
    <button #menuToggle type="button" (click)="$event.stopPropagation(); isMenuOpen = !isMenuOpen"
      [attr.aria-expanded]="isMenuOpen" aria-controls="catalog-navigation"
      [attr.aria-label]="isMenuOpen ? 'Cerrar menú' : 'Abrir menú'"
      class="flex h-11 w-11 shrink-0 items-center justify-center hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-black xl:hidden">
      <lucide-icon [img]="isMenuOpen ? closeIcon : menuIcon" class="h-5 w-5"></lucide-icon>
    </button>

    <a routerLink="/" (click)="goHome()" class="flex h-[68px] shrink-0 items-center gap-2" aria-label="Metaluxe, inicio">
      <img src="assets/images/img-1.png" alt="Metaluxe" class="h-9 w-auto object-contain" />
      <span class="text-xl font-bold tracking-tight" style="font-family: 'Fredoka', sans-serif;">Metaluxe</span>
    </a>

    <nav id="catalog-navigation" aria-label="Navegación del catálogo" (click)="$event.stopPropagation()"
      (keydown.escape)="closeMenu(); menuToggle.focus()"
      [ngClass]="isMenuOpen ? 'flex' : 'hidden'"
      style="font-family: Inter, 'Segoe UI', system-ui, sans-serif"
      class="absolute left-0 top-full max-h-[calc(100dvh-176px)] w-full flex-col overflow-y-auto border-b border-gray-200 bg-white p-4 shadow-lg xl:static xl:ml-auto xl:flex xl:w-auto xl:flex-row xl:items-center xl:gap-7 xl:overflow-visible xl:border-0 xl:p-0 xl:shadow-none">
      <a routerLink="/" (click)="goHome()" class="flex min-h-11 items-center border-b-2 border-transparent text-[13px] font-semibold uppercase tracking-[0.12em] text-[#111] transition-colors hover:border-[#111] focus-visible:border-[#111]">Inicio</a>
      <button *ngFor="let item of quickNavigation" type="button" (click)="selectQuickFilter(item.filter)"
        class="flex min-h-11 items-center border-b-2 border-transparent text-[13px] font-semibold uppercase tracking-[0.12em] text-[#111] transition-colors hover:border-[#111] focus-visible:border-[#111]">
        {{ item.label }}
      </button>
    </nav>

    <form role="search" (ngSubmit)="submitSearch()" class="order-last flex h-[52px] w-full items-start xl:order-none xl:ml-auto xl:h-[68px] xl:w-64 xl:shrink xl:items-center">
      <div class="flex h-10 w-full items-center gap-2 rounded border border-gray-300 bg-gray-50 px-3 focus-within:border-black">
        <lucide-icon [img]="searchIcon" class="h-4 w-4 shrink-0 text-gray-500"></lucide-icon>
        <input type="search" name="catalogSearch" autocomplete="off" placeholder="Buscar banda o álbum"
          aria-label="Buscar productos por banda o álbum" [ngModel]="searchQuery" (ngModelChange)="search($event)"
          class="min-w-0 flex-1 bg-transparent text-sm outline-none" />
        <button *ngIf="searchQuery" type="button" (click)="search('')" aria-label="Limpiar búsqueda"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded hover:bg-gray-200">
          <lucide-icon [img]="closeIcon" class="h-4 w-4"></lucide-icon>
        </button>
      </div>
    </form>

    <div class="ml-auto flex h-[68px] shrink-0 items-center gap-1 xl:ml-0">
      <button (click)="toggleCartSidebar()" type="button" aria-label="Abrir carrito"
        class="relative flex h-11 w-11 items-center justify-center hover:bg-gray-100">
        <lucide-icon [img]="cartIcon" class="h-5 w-5"></lucide-icon>
        <span *ngIf="totalCount() > 0" class="absolute right-0 top-0 min-w-5 rounded-full bg-black px-1 text-center text-[11px] leading-5 text-white">{{ totalCount() }}</span>
      </button>
      <button type="button" aria-label="Cuenta de usuario" class="hidden h-11 w-11 items-center justify-center hover:bg-gray-100 sm:flex">
        <lucide-icon [img]="userIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>
  </div>
</header>

<app-cart-list [isOpen]="isCartSidebarOpen" (close)="closeCartSidebar()"></app-cart-list>
