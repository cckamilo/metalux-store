<header class="fixed top-0 z-30 w-full border-b border-gray-200 bg-white text-gray-900">
  <div class="mx-auto flex min-h-[68px] w-full max-w-[1800px] items-center gap-5 px-5 lg:px-8">
    <div class="flex shrink-0 items-center gap-3">
      <button (click)="onToggleMenu()" type="button" aria-label="Abrir filtros"
        class="flex items-center justify-center text-gray-900">
        <lucide-icon [img]="menuIcon" class="h-5 w-5"></lucide-icon>
      </button>

      <a routerLink="/" (click)="goHome()" class="flex items-center gap-2" aria-label="Metaluxe, inicio">
        <img src="assets/images/img-1.png" alt="Metaluxe" class="h-9 w-auto object-contain" />
        <span class="text-xl font-bold tracking-tight" style="font-family: 'Fredoka', sans-serif;">Metaluxe</span>
      </a>
    </div>

    <nav class="ml-auto hidden items-center gap-7 lg:flex" aria-label="Navegación del catálogo">
      <a routerLink="/" (click)="goHome()"
        class="text-[11px] font-medium uppercase tracking-[0.16em] text-gray-700 transition hover:text-black">
        Inicio
      </a>
      <button *ngFor="let item of quickNavigation" type="button" (click)="selectQuickFilter(item.filter)"
        class="text-[11px] font-medium uppercase tracking-[0.16em] text-gray-700 transition hover:text-black">
        {{ item.label }}
      </button>
    </nav>

    <div class="ml-auto flex shrink-0 items-center gap-4">
      <button (click)="toggleSearch()" type="button" aria-label="Buscar" class="hover:text-gray-600">
        <lucide-icon [img]="searchIcon" class="h-5 w-5"></lucide-icon>
      </button>

      <input *ngIf="showSearch" type="text" placeholder="Buscar..." aria-label="Buscar productos"
        class="absolute right-16 top-[74px] w-48 border border-gray-300 bg-white px-3 py-2 text-sm text-black shadow-sm focus:outline-none focus:ring-1 focus:ring-black" />

      <button (click)="toggleCartSidebar()" type="button" aria-label="Abrir carrito" class="relative hover:text-gray-600">
        <lucide-icon [img]="cartIcon" class="h-5 w-5"></lucide-icon>
        <span *ngIf="totalCount() > 0"
          class="absolute -right-2 -top-2 rounded-full bg-red-600 px-1.5 py-0.5 text-xs text-white">
          {{ totalCount() }}
        </span>
      </button>

      <button type="button" aria-label="Cuenta de usuario" class="hidden hover:text-gray-600 sm:block">
        <lucide-icon [img]="userIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>
  </div>
</header>

<app-cart-list [isOpen]="isCartSidebarOpen" (close)="closeCartSidebar()"></app-cart-list>
