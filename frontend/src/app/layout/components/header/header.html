<!-- Header -->
<header class="w-full bg-gray-900 text-white shadow-md fixed top-0 z-30">
  <div class="w-full flex items-center justify-between px-4 py-2 min-h-[52px]">
      <!-- Ícono hamburguesa -->
    <button (click)="onToggleMenu()" class="text-white text-xl mr-4 flex items-center justify-center">
      <i data-lucide="menu"></i>
    </button>

    <!-- Logo Metaluxe -->
    <div class="text-2xl font-bold flex items-center space-x-1 leading-tight">
      <span class="text-red-500 font-['UnifrakturCook']">META</span>
      <span class="text-white font-['UnifrakturCook']">LUXE</span>
    </div>

    <!-- Iconos a la derecha -->
    <div class="flex items-center gap-3 ml-auto pr-2">
      <!-- Lupa -->
      <button (click)="toggleSearch()" class="hover:text-gray-300">
        <i data-lucide="search" class="w-5 h-5"></i>
      </button>

      <!-- Input de búsqueda (condicional) -->
      <input *ngIf="showSearch" type="text" placeholder="Buscar..."
        class="bg-gray-800 text-white border border-gray-600 rounded px-3 py-1 focus:outline-none focus:ring focus:ring-blue-500" />

      <!-- Carrito -->
      <div (click)="toggleCartSidebar()" class="relative">
        <i data-lucide="shopping-cart" class="w-5 h-5 hover:text-gray-300 cursor-pointer"></i>
        <span *ngIf="totalItems() > 0"
          class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full px-1.5 py-0.5">
          {{ totalItems() }}
        </span>
      </div>

      <!-- Usuario -->
      <i data-lucide="user" class="w-5 h-5 hover:text-gray-300 cursor-pointer"></i>
    </div>
  </div>
</header>
<!-- Overlay -->
<div *ngIf="isCartSidebarOpen" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40" (click)="closeCartSidebar()">
</div>
<!-- Overlay para el carrito -->
<div *ngIf="isCartSidebarOpen" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40" (click)="closeCartSidebar()">
</div>

<app-cart-list [isOpen]="isCartSidebarOpen" (close)="closeCartSidebar()"></app-cart-list>
