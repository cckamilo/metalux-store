<app-header (menuClicked)="toggleSidebar()"></app-header>

<div *ngIf="isSidebarOpen" class="fixed inset-0 z-30 bg-[rgba(0,0,0,0.6)] transition-opacity duration-300" (click)="closeSidebar()">
  <!-- Este div detiene la propagación del clic interno -->
  <div class="absolute top-0 left-0 h-full w-96" (click)="$event.stopPropagation()">
    <app-sidenav [isOpen]="isSidebarOpen" (close)="closeSidebar()"></app-sidenav>
  </div>
</div>

<main class="min-h-screen px-4 py-8">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
