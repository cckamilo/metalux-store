<div
  class="fixed top-0 left-0 h-full w-80 z-[999] bg-black text-white shadow-xl transform transition-transform duration-500 ease-out overflow-y-auto font-sans"
  [ngClass]="{ 'translate-x-0': isOpen, '-translate-x-full': !isOpen }">

  <button (click)="onCloseClick()" class="absolute top-4 right-4 text-gray-300 hover:text-white z-[1000]">
    <lucide-icon [img]="closeIcon" class="w-6 h-6"></lucide-icon>
  </button>

  <div class="px-5 pt-6 pb-10">
    <div *ngFor="let filtro of filteredFiltroList" class="mb-8">

      <div class="flex items-center gap-2 mb-3">
        <h3 class="text-xs font-medium text-gray-300 uppercase tracking-wide">
          {{ filtro.title }}
        </h3>
      </div>

      <ng-container *ngIf="filtro.subcategories; else simpleOptions">
        <div *ngFor="let sub of filtro.subcategories" class="mb-5 pl-3">
          <p class="text-xs font-light text-gray-400 mb-2 tracking-wide">
            {{ sub.name }}
          </p>
          <div class="flex flex-wrap gap-2">
            <button
              *ngFor="let option of sub.options"
              (click)="onFilterChange(option)"
              [ngClass]="{
                'bg-white text-black': isFilterSelected(option),
                'bg-transparent text-gray-200 border-white hover:bg-gray-800': !isFilterSelected(option)
              }"
              class="px-3 py-1.5 text-xs border rounded transition-colors duration-200"
            >
              {{ option }}
            </button>
          </div>
        </div>
      </ng-container>

      <ng-template #simpleOptions>
        <div class="flex flex-wrap gap-2 pl-3">
          <button
            *ngFor="let option of filtro.options"
            (click)="onFilterChange(option)"
            [ngClass]="{
              'bg-white text-black': isFilterSelected(option),
              'bg-transparent text-gray-200 border-white hover:bg-gray-800': !isFilterSelected(option)
            }"
            class="px-3 py-1.5 text-xs border rounded transition-colors duration-200"
          >
            {{ option }}
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</div>
